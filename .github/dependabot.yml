---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /src/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: terraform
    directory: /modules/kms/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'
